name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest   # provides Docker for Testcontainers
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test, coverage gate
        run: ./mvnw -B verify
        env:
          # Dummy key so Spring AI autoconfig wires the chat client at startup.
          # No LLM call is made during the test suite.
          SPRING_AI_OPENAI_API_KEY: ci-test-key

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore
